[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "usb-4g-dongle-macos-manager"
version = "0.3.0"
description = "An independent macOS desktop companion for compatible USB 4G dongles"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "geek-lawyer"}]
dependencies = [
  "PySide6>=6.10,<6.11",
  "pyusb>=1.3,<2",
  "psutil>=6,<8",
  "opencc-python-reimplemented>=0.1.7,<0.2",
  "qtawesome>=1.4,<2",
]

[project.scripts]
baiwang-connect = "baiwang_mac.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
