[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "dji-4g-dongle-macos-manager"
version = "0.2.0"
description = "A native-feeling macOS desktop companion for the DJI Baiwang 4G dongle"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Proprietary"}
authors = [{name = "goodday00"}]
dependencies = [
  "PySide6>=6.10,<6.11",
  "pyusb>=1.3,<2",
]

[project.scripts]
baiwang-connect = "baiwang_mac.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
